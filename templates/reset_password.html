<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - O2D-Demo</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0066cc 0%, #0052a3 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .reset-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 450px;
      padding: 2.5rem;
      animation: slideIn 0.5s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-30px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .reset-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .icon-circle {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #16a34a, #15803d);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      color: white;
      font-size: 36px;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    h1 {
      color: #1a202c;
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    p {
      color: #718096;
      font-size: 0.9rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      color: #2d3748;
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #a0aec0;
      font-size: 0.9rem;
    }
    input {
      width: 100%;
      padding: 0.85rem 0.9rem 0.85rem 2.75rem;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 0.95rem;
      transition: all 0.2s;
      background: #f7fafc;
      font-family: inherit;
    }
    input:focus {
      outline: none;
      border-color: #16a34a;
      background: white;
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.1);
    }
    .password-strength {
      height: 4px;
      background: #e2e8f0;
      border-radius: 2px;
      margin-top: 0.5rem;
      overflow: hidden;
    }
    .password-strength-bar {
      height: 100%;
      width: 0%;
      transition: all 0.3s;
    }
    .password-strength-bar.weak { width: 33%; background: #dc2626; }
    .password-strength-bar.medium { width: 66%; background: #ea580c; }
    .password-strength-bar.strong { width: 100%; background: #16a34a; }
    .btn-reset {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 0.5rem;
    }
    .btn-reset:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(22, 163, 74, 0.4);
    }
    .success-msg, .error-msg {
      padding: 0.85rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      display: none;
      font-size: 0.85rem;
    }
    .success-msg {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .error-msg {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .requirements {
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1rem;
    }
    .requirements h4 {
      font-size: 0.85rem;
      color: #2d3748;
      margin-bottom: 0.5rem;
    }
    .requirements ul {
      list-style: none;
      padding: 0;
    }
    .requirements li {
      font-size: 0.8rem;
      color: #718096;
      padding: 0.25rem 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .requirements li i {
      font-size: 0.7rem;
    }
    .requirements li.valid {
      color: #16a34a;
    }
  </style>
</head>
<body>
  <div class="reset-container">
    <div class="reset-header">
      <div class="icon-circle">
        <i class="fas fa-shield-alt"></i>
      </div>
      <h1>Reset Password</h1>
      <p>Create a new secure password for your account</p>
    </div>

    <div id="successMsg" class="success-msg"></div>
    <div id="errorMsg" class="error-msg"></div>

    <form id="resetForm">
      <div class="form-group">
        <label>New Password</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" id="newPassword" placeholder="Enter new password" required>
        </div>
        <div class="password-strength">
          <div class="password-strength-bar" id="strengthBar"></div>
        </div>
      </div>

      <div class="form-group">
        <label>Confirm New Password</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
        </div>
      </div>

      <div class="requirements">
        <h4>Password Requirements:</h4>
        <ul>
          <li id="req-length"><i class="fas fa-circle"></i> At least 8 characters</li>
          <li id="req-case"><i class="fas fa-circle"></i> Upper & lowercase letters</li>
          <li id="req-number"><i class="fas fa-circle"></i> At least one number</li>
          <li id="req-special"><i class="fas fa-circle"></i> At least one special character</li>
        </ul>
      </div>

      <button type="submit" class="btn-reset">
        <i class="fas fa-check-circle"></i> Reset Password
      </button>
    </form>
  </div>

  <script>
    const token = '{{ token }}';

    document.getElementById('newPassword').addEventListener('input', (e) => {
      const password = e.target.value;
      const bar = document.getElementById('strengthBar');
      let strength = 0;

      const hasLength = password.length >= 8;
      const hasCase = /[a-z]/.test(password) && /[A-Z]/.test(password);
      const hasNumber = /[0-9]/.test(password);
      const hasSpecial = /[^a-zA-Z0-9]/.test(password);

      document.getElementById('req-length').classList.toggle('valid', hasLength);
      document.getElementById('req-case').classList.toggle('valid', hasCase);
      document.getElementById('req-number').classList.toggle('valid', hasNumber);
      document.getElementById('req-special').classList.toggle('valid', hasSpecial);

      if (hasLength) strength++;
      if (hasCase) strength++;
      if (hasNumber) strength++;
      if (hasSpecial) strength++;

      bar.className = 'password-strength-bar';
      if (strength >= 4) bar.classList.add('strong');
      else if (strength >= 2) bar.classList.add('medium');
      else if (strength >= 1) bar.classList.add('weak');
    });

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');
      
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';

      if (newPassword !== confirmPassword) {
        errorMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> Passwords do not match!';
        errorMsg.style.display = 'block';
        return;
      }

      if (newPassword.length < 8) {
        errorMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> Password must be at least 8 characters!';
        errorMsg.style.display = 'block';
        return;
      }

      try {
        const res = await fetch(`/reset-password/${token}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: newPassword })
        });

        const data = await res.json();
        
        if (data.success) {
          successMsg.innerHTML = '<i class="fas fa-check-circle"></i> Password reset successfully! Redirecting to login...';
          successMsg.style.display = 'block';
          
          setTimeout(() => {
            window.location.href = '/login';
          }, 2000);
        } else {
          errorMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> ' + (data.error || 'Password reset failed');
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Connection error. Please try again.';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
